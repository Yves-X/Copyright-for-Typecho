name: Test

on:
  push:
  pull_request:
  # Typecho 的 master 分支仍在持续更新，每周跑一次以便及时发现不兼容
  schedule:
    - cron: '0 3 * * 1'

jobs:
  lint:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: typecho/typecho
          path: typecho
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
        env:
          TYPECHO_DIR: ${{ github.workspace }}/typecho

  e2e:
    name: Typecho ${{ matrix.typecho }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typecho: ['1.2.0', '1.2.1', '1.3.0', 'master']
        php: ['7.4', '8.1', '8.3', '8.4']
        include:
          - typecho: '1.3.0'
            php: '8.5'
          - typecho: 'master'
            php: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Syntax
        run: for file in *.php tests/*.php; do php -l "$file"; done
      - name: End-to-end
        run: tests/e2e.sh ${{ matrix.typecho }}
